[package]
name = "fandhe-edge-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Inference SDK layer (single/batch shared inference path) for fandhe-edge-model."

[dependencies]
# workspace 内の path 依存のみ（外部 crate は追加しない。REQ-32: 学習側に依存しない）。
# 用途は入力サイズ上限 `MAX_INFER_INPUT_BYTES` の参照に限る。
fandhe-edge-core.workspace = true

[dev-dependencies]
# テスト専用。評価器経路（`run_inference_input_only`）との全件一致照合用（REQ-28・#118）。
# workspace 内の path 依存のみで、本体の依存（推論は学習・評価器に依存しない）には影響しない。
fandhe-edge-eval.workspace = true

[lints]
workspace = true
