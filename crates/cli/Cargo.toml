[package]
name = "fandhe-edge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Thin CLI adapter for the register/inspect/train/evaluate/select/package/infer pipeline"

[lib]
name = "fandhe_edge_cli"
path = "src/lib.rs"

[[bin]]
name = "fandhe-edge"
path = "src/main.rs"

[dependencies]
fandhe-edge-core.workspace = true
# 各層のエラー型を ErrorReport へ写す変換（TASK-33.2-1・#138）のための
# workspace 内 path 依存（外部依存の追加ではない）。推論ランタイム側の crate
# には train を入れない方針（REQ-32）は維持する。
fandhe-edge-data.workspace = true
fandhe-edge-train.workspace = true
# package の合否結果（PackageOutcome）を stdout JSON へ写す（TASK-33.2-2・#139）ための
# workspace 内 path 依存。runtime は core にしか依存せず、学習側依存は入らない（REQ-32）。
fandhe-edge-runtime.workspace = true
# `infer` の `--package`・`onnx_file` の経路の閉じ込め（REQ-39・TASK-39.4-2・#159）と、
# 容量計測 example（#123）の open_confined に使う。workspace 内 path 依存のみ（外部依存の追加ではない）。
fandhe-edge-guard.workspace = true

[lints]
workspace = true
