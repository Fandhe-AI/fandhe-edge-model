[package]
name = "fandhe-edge-train"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Train worker request/result contract (JSON boundary types) for fandhe-edge-model."

[dependencies]
# 共通コアの定義ファイル型（`Definition`）から `label_order` を投影するために使う
# （REQ-15・REQ-18・REQ-19。#177）。
fandhe-edge-core.workspace = true
# 学習リクエスト・結果 JSON の検証済み型への読み込み・直列化に使う（2026-09-27
# オーナー承認済み。配置層に学習ワーカー層〔本 crate〕が加わることは
# dependency-policy.md「承認済みの依存」の表更新と合わせてオーナー確認事項とする）。
serde.workspace = true
serde_json.workspace = true
# 選定結果への McNemar／Holm 有意性判定の付与に評価器を呼ぶために使う
# （評価ロジックは再実装しない。REQ-18・TASK-18.3-1・#87）。workspace 内の
# path 依存であり、外部 crate の追加ではない（dependency-policy.md「承認済みの
# 依存」の対象外）。`fandhe-edge-eval` は `fandhe-edge-train` に依存しておらず
# 循環しない。
fandhe-edge-eval.workspace = true

[lints]
workspace = true
