# 学習ワーカー（学習ワーカー層。REQ-18〜20/19b。ジョブ管理 REQ-34 は Rust 側）の
# self-contained uv プロジェクト。
#
# 将来の Rust workspace ルートとは別ディレクトリに切り出している理由:
# 推論ランタイムは学習側（Python・MLX・学習用依存）に一切依存しない（REQ-32）。
# `trainer/` を独立した uv プロジェクトとして分離することで、この境界を
# ディレクトリ構造そのもので可視化する（依存関係の混入をレビューで見つけやすくする）。
#
# 依存方針（.claude/rules/dependency-policy.md）: 依存最小・ユーザー承認制・完全固定。
# 2026-09-27 時点でオーナーが承認した直接依存は次の 6 件（TASK-19.1/19.3・C3 の
# 学習実装）: uv 0.12.19 / ruff 0.16.9 / pytest 9.1.1・学習/書き出し用の
# mlx==0.32.2・numpy==2.5.3・onnx==1.23.0。scikit-learn・onnxruntime・torch・
# safetensors パッケージは未承認のため追加していない。
#
# 推移的依存とライセンス（`uv.lock` 解決結果。importlib.metadata で確認。すべて
# permissive ライセンスだが、typing_extensions の PSF-2.0・numpy が同梱する
# 0BSD/CC0-1.0 コンポーネントは licensing.md の許可リスト（MIT/Apache-2.0/BSD/
# ISC/Unlicense/Zlib 等）に文字どおりには列挙されていないため、オーナーによる
# 明示的な許容確認が未了である点を記録する）:
#   - mlx==0.32.2: MIT
#   - mlx-metal==0.32.2（mlx の推移的依存。macOS arm64 専用の Metal 実装。
#     推論ランタイムには持ち込まない。REQ-32）: MIT
#   - numpy==2.5.3: License-Expression が
#     "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0"（同梱コードの
#     ライセンスを含む複合表記）
#   - onnx==1.23.0: Apache-2.0
#   - protobuf==7.36.2（onnx の推移的依存）: BSD-3-Clause
#   - ml-dtypes==0.6.0（onnx の推移的依存）: Apache-2.0
#   - typing-extensions==4.16.0（onnx の推移的依存）: PSF-2.0
[project]
name = "fandhe-edge-model-trainer"
version = "0.0.0"
description = "fandhe-edge-model の学習ワーカー（候補学習・選定・選択口。C3=バイト CNN を実装）"
requires-python = "==3.12.*"
license = "MIT OR Apache-2.0"
dependencies = ["mlx==0.32.2", "numpy==2.5.3", "onnx==1.23.0"]

[dependency-groups]
dev = ["ruff==0.16.9", "pytest==9.1.1"]

[tool.uv]
# `Cargo.toml` の `=x.y.z` 完全固定方針に合わせ、uv 自体のバージョンも固定する
# （Makefile の UV_VERSION と同期させる。乖離時は本ファイルを正とし Makefile を追従させる）。
required-version = "==0.12.19"
# ビルドバックエンドを持たない（配布パッケージを作らないスタブのため）。
# pytest はソース配置 + `[tool.pytest.ini_options] pythonpath` で解決する。
package = false
# mlx の wheel は macOS 14 以降・arm64 のみ提供される（.claude/rules/coding-python.md・
# python-ci.yml のコメント）。他プラットフォーム向けの解決を uv に試みさせず、
# lock 対象環境をこの 1 通りに限定する。
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# S（bandit 相当）で coding-python.md が禁じる pickle・eval/exec・非 safe yaml.load・
# shell=True 等の危険な読み込み・実行パターンを機械検出する。
select = ["E", "F", "W", "I", "B", "UP", "S", "PT", "RUF"]
# 日本語コメント・docstring 中の全角記号（（）・：・〜等）は ambiguous-unicode 判定
# （RUF001/002/003）に確実に抵触する。日本語での記述は
# .claude/rules/japanese-style.md・code-comment-style.md の必須要件のため、
# ASCII 記号への書き換えではなくルール側を無効化して対応する。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# pytest の assert はテストの本質であり bandit S101（assert 使用）の対象外とする。
"tests/*" = ["S101"]
# S603（subprocess の呼び出し）は test_cli.py だけが `sys.executable` を引数リストで
# （shell=True を使わず）呼ぶために必要で、危険な用法ではないため対象外とする
# （他のテストファイルには subprocess 呼び出しが無いため、抑止範囲をここへ限定する）。
"tests/test_cli.py" = ["S603"]
