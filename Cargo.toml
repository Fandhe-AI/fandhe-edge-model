# fandhe-edge-model の Rust workspace 定義（REQ-15〜40。TASK-15.2）。
# 6 層（共通コア・データ契約・学習ワーカー・評価器・成果物/推論 SDK・操作アダプター）に
# 対応する crate を `crates/<name>/` の 1 階層に置く。Makefile の
# `HAS_MEMBERS := $(wildcard crates/*/Cargo.toml)` が 1 階層のパターンを前提にしているため、
# 深い階層（`crates/foo/bar`）には crate を置かない。
[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/data", "crates/eval", "crates/train", "crates/runtime", "crates/guard"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-edge-model"
# crates.io の公開名・公開方針は未確定（release.yml は無効化中）。
# 誤公開を防ぐため、当面すべての member crate で publish = false を継承する。
publish = false

[workspace.dependencies]
# 依存は `=x.y.z` の完全固定・ユーザー承認制（.claude/rules/dependency-policy.md）。
# 推論ランタイム側の crate に学習側の依存（Python 呼び出し・MLX 等）を持ち込まない（REQ-32）。
# workspace 内の crate 間依存（path 依存）もここへ集約し、各 crate は `workspace = true` で継承する。
fandhe-edge-core = { path = "crates/core" }
fandhe-edge-data = { path = "crates/data" }
fandhe-edge-eval = { path = "crates/eval" }
fandhe-edge-train = { path = "crates/train" }
# 推論 SDK 層（REQ-28・#117）。外部依存なし（workspace 内 path 依存のみ）。
fandhe-edge-runtime = { path = "crates/runtime" }
# ガード層（REQ-39・TASK-39.2-1・#153）。外部依存なし（workspace 内 path 依存のみ）。
fandhe-edge-guard = { path = "crates/guard" }
# serde・serde_json は 2026-09-27 オーナー承認済み（.claude/rules/dependency-policy.md
# 「承認済みの依存」表。定義ファイル・JSON 入出力の型への読み込みに使う）。serde_json の
# 「配置する層」は共通コア（TASK-15.3〜15.5）に加え、データ契約層（crates/data。
# TASK-16.1-1・issue #38）にも 2026-09-27 オーナー承認済み（PR #191 のレビュー指摘への
# 対応として PR #193 で承認記録を追記。バージョン・ライセンス（MIT OR Apache-2.0）・
# 推移的依存（itoa・memchr・zmij）は変更なし）。
# #177 で学習ワーカー層（crates/train）への配置も加わる。版・ライセンス・推移的依存は
# 変更せず、この配置層の追加は 2026-09-28 オーナー承認済み
# （.claude/rules/dependency-policy.md「承認済みの依存」表に反映済み）。
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# sha2 は 2026-09-27 オーナー承認済み（.claude/rules/dependency-policy.md
# 「承認済みの依存」表。正準化ハッシュ〔TASK-15.5〕の sha256 計算に使う。
# PoC-16 の `shasum` 子プロセス起動を置き換え、OS・外部コマンドに依存させない）。
sha2 = "=0.11.0"
# unicode-normalization は 2026-09-28 オーナー承認済み（.claude/rules/dependency-policy.md
# 「承認済みの依存」表。承認記録は PR #224）。データ契約層（crates/data）の矛盾検出
# （TASK-16.2-2・#42・REQ-16）で NFKC 正規化を行い、学習ワーカー（Python `unicodedata`）
# と同じ規則にするために使う。推論側には配置しない。
# 版は =0.1.22 に固定する（`UNICODE_VERSION == (15, 0, 0)`）。学習ワーカー
# （Python 3.12 の `unicodedata`。UCD 15.0.0 準拠）と Unicode 版を一致させ、
# NFKC の版差による結果の食い違いを避けるための選択（0.1.25 は Unicode 17.0
# 準拠で版がずれていた。PR #188 Codex レビュー P1 指摘・オーナー承認記録は
# PR #225）。
unicode-normalization = "=0.1.22"

[workspace.lints.rust]
# unsafe は原則禁止（.claude/rules/coding-rust.md）。FFI 境界（ONNX Runtime 等）で
# やむを得ず必要な crate だけが、`#[allow(unsafe_code)]` と `// SAFETY:` コメントで
# 局所的に許可する。`forbid` にすると crate 側で `#[allow]` による局所許可ができなくなるため
# `deny` を採用する。
unsafe_code = "deny"
