# Git hooks 定義（lefthook）。`make hooks`（lefthook install）で導入する。
#
# 方針（.claude/rules/conventional-commits.md・security.md。Fandhe-AI/fandhe-container と同一）:
# - --no-verify によるスキップは禁止
# - Cargo.toml 未追加（workspace 作成予定）の間、cargo 系ジョブはスキップする
#   （Makefile の HAS_CARGO 判定と同一方針）
# - 重いチェック（clippy・test）は pre-push に置き、pre-commit は整形チェックのみで軽量に保つ

pre-commit:
  parallel: true
  jobs:
    # staged の .rs のみ rustfmt --check（整形は make fmt / PostToolUse フックで実施済みの想定）。
    # rustfmt 単体は Cargo.toml を読まず既定 edition 2015 で検査してしまうため、
    # workspace の正である Cargo.toml の edition を明示指定する
    - name: rustfmt-check
      glob: "*.rs"
      run: |
        if [ -f Cargo.toml ] && command -v rustfmt >/dev/null 2>&1; then
          ed=$(sed -n 's/^edition *= *"\([0-9]\{4\}\)".*/\1/p' Cargo.toml | head -n1)
          rustfmt --edition "${ed:-2024}" --check -- {staged_files}
        else
          echo "skip: Cargo.toml 未追加または rustfmt 未導入"
        fi

    # 秘密情報の混入検査（.claude/rules/security.md）。資格情報ファイルの stage を拒否する。
    # 判定は create-commit スキルの RE_CREDFILE / RE_CREDFILE_OK の対と同一の正規表現を
    # ベースにする（`(^|/)` アンカーでサブディレクトリ内の `.env.*` も検出し、
    # 拡張子なしの SSH 鍵 `id_rsa` / `id_ed25519` も拒否する。一方 `.env.example` 等の
    # 雛形・`id_rsa.pub` 等の公開鍵は許可リストで通す。拡張子 `.env` は旧パターンの
    # 検出範囲を維持するため追加している）。
    # {staged_files} は rename 後の名前しか含まないため、`.env` 等を無害な名前へ rename
    # すると素通りする。staged の name-status から rename / copy 元と先の両方を検査する。
    # `-C -C`（--find-copies-harder 相当）で、今回変更していない追跡済みファイルからの
    # コピーも copy として検出する（git 管理外のファイルからのコピーは git から元の名前を
    # 知る手段がないため、内容検査の secrets-content-guard が担う）。
    # 一覧を取得できない場合は検査不能として失敗させる（fail-closed）
    - name: secrets-guard
      run: |
        re='(^|/)\.env(\..+)?$|(^|/)(id_rsa|id_ed25519)(\..+)?$|\.(pem|p12|pfx|key|env)$'
        re_ok='\.(example|sample|template|pub)$'
        if ! status=$(git diff --cached --name-status -M -C -C --diff-filter=ACMR --no-ext-diff); then
          echo "NG: staged ファイル一覧を取得できないため秘密情報の検査を実施できません" >&2
          exit 1
        fi
        # name-status はタブ区切り（R/C 行は「状態 元 先」）。状態列を除いたパス列を 1 行 1 件に
        # 展開し、特殊文字を含むパスに git が付ける前後の二重引用符を外してから判定する。
        # 末尾 grep の終了状態は 0=一致あり・1=一致なし・2 以上=検査エラー（fail-closed）
        bad=$(printf '%s\n' "$status" | cut -f2- | tr '\t' '\n' | sed -e 's/^"//' -e 's/"$//' \
          | grep -E "$re" | grep -vE "$re_ok")
        rc=$?
        if [ "$rc" -gt 1 ]; then
          echo "NG: 秘密情報ファイルの判定でエラーが発生しました" >&2
          exit 1
        fi
        if [ -n "$bad" ]; then
          printf '%s\n' "$bad" | sed 's/^/NG: 秘密情報ファイルがステージされています（rename \/ copy 元を含む）: /' >&2
          exit 1
        fi

    # ファイル名パターンだけでは検出できない、内容そのものに秘密情報らしき
    # 文字列が含まれるケースの「うっかり」防止(網羅的な検出ではない。
    # サーバー側の最終防御線は GitHub の secret scanning + push protection
    # （リポジトリ設定で有効化済み）。誤検知した場合も --no-verify での回避は
    # 行わず、該当箇所の値を除去してから再ステージする）。
    # staged diff の追加行（`+` 始まり。削除行・`+++` ヘッダ行は対象外）のみを
    # 走査する。`--no-renames` により rename は「元の削除 + 先の新規追加」として扱い、
    # 内容が変わらない rename でも移動先の全行を走査する。バイナリファイルは
    # git diff が +/- 行を出力しないため対象外（バイナリの資格情報ファイルは
    # secrets-guard のファイル名検査が担う）。diff を取得できない場合は検査不能として
    # 失敗させる（fail-closed）。検出時はファイル名とパターン種別のみを表示し、
    # 値そのものは出力しない。
    - name: secrets-content-guard
      run: |
        patterns='
        -----BEGIN [A-Z ]*PRIVATE KEY-----|private-key
        AKIA[0-9A-Z]{16}|aws-access-key-id
        gh[pousr]_[A-Za-z0-9]{36,}|github-token
        github_pat_[A-Za-z0-9_]{20,}|github-fine-grained-pat
        sk-ant-[A-Za-z0-9_-]{20,}|anthropic-api-key
        xox[abprs]-[A-Za-z0-9-]{10,}|slack-token
        AIza[0-9A-Za-z_-]{35}|google-api-key
        '
        # パイプの左辺（git diff）の失敗は右辺の while に隠れて成功扱いになるため、
        # 先に変数へ取得して終了状態を確認する
        if ! diff=$(git diff --cached --no-renames --diff-filter=ACMR -U0 --no-ext-diff --no-color -- .); then
          echo "NG: staged diff を取得できないため秘密情報の検査を実施できません" >&2
          exit 1
        fi
        file=""
        printf '%s\n' "$diff" | while IFS= read -r line; do
          case "$line" in
            "+++ b/"*)
              file="${line#+++ b/}"
              ;;
            "+++ "*)
              ;;
            "+"*)
              content="${line#+}"
              printf '%s\n' "$patterns" | while IFS='|' read -r pat kind; do
                [ -z "$pat" ] && continue
                if printf '%s' "$content" | grep -Eq -- "$pat"; then
                  echo "NG: 秘密情報らしき文字列を検出しました: file=${file:-(unknown)} pattern=$kind" >&2
                  exit 1
                fi
              done || exit 1
              ;;
          esac
        done

commit-msg:
  jobs:
    # Conventional Commits 形式の検証（.claude/rules/conventional-commits.md）。
    # オフラインで完結する軽量な正規表現検査とし、正式な commitlint（config-conventional +
    # commitlint.config.mjs）は CI（lint-docs の commitlint ジョブ）・make lint-commits が担う。
    # Merge / Revert / fixup コミットは対象外とする
    - name: conventional-commits
      run: |
        msg="$(head -n1 {1})"
        case "$msg" in
          Merge*|Revert*|fixup!*|squash!*) exit 0 ;;
        esac
        if ! printf '%s' "$msg" | grep -qE '^(feat|fix|perf|refactor|test|docs|build|ci|chore)(\([^)]+\))?!?: .+'; then
          echo "NG: Conventional Commits 形式ではありません: $msg" >&2
          echo "形式: <type>(<scope>): <説明>  （type: feat|fix|perf|refactor|test|docs|build|ci|chore）" >&2
          exit 1
        fi

pre-push:
  jobs:
    # clippy・test は Makefile の lint / test ターゲットへ委譲し、既定 feature のみで
    # 実行する（`--all-features` 込みの検証は CI の rust-ci ジョブが担う）。
    # Cargo.toml 未追加・メンバー crate 未作成なら make 側の HAS_CARGO / HAS_MEMBERS
    # 判定で skip する
    - name: clippy
      run: |
        if [ -f Cargo.toml ]; then
          make lint
        else
          echo "skip: Cargo.toml 未追加"
        fi
    - name: test
      run: |
        if [ -f Cargo.toml ]; then
          make test
        else
          echo "skip: Cargo.toml 未追加"
        fi
