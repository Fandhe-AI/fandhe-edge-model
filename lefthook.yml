# Git hooks 定義（lefthook）。`make hooks`（lefthook install）で導入する。
#
# 方針（.claude/rules/conventional-commits.md・security.md。Fandhe-AI/fandhe-container と同一）:
# - --no-verify によるスキップは禁止
# - Cargo.toml 未追加（workspace 作成予定）の間、cargo 系ジョブはスキップする
#   （Makefile の HAS_CARGO 判定と同一方針）
# - trainer/pyproject.toml 未追加の間、学習ワーカー（Python）系ジョブも同様にスキップする
#   （Makefile の HAS_PY 判定と同一方針）
# - フックの追加・変更時は .claude/rules/git-hooks.md の方針（時間予算・CI との役割分担）に従う
# - テスト・clippy・ruff check・pytest など重い検査や CI と重複する検査はフックに置かず、
#   CI（.github/workflows/ci.yml・python-ci.yml）に任せる。pre-push は置かない。
#   pre-commit は staged 限定・glob 限定の 1 秒未満の検査と、push 後では手遅れの
#   秘密情報検査に限る（CI と重複して残す検査は git-hooks.md の「明示的な例外」に列挙）

pre-commit:
  parallel: true
  jobs:
    # staged の .rs のみ rustfmt --check（整形は make fmt / PostToolUse フックで実施済みの想定）。
    # rustfmt 単体は Cargo.toml を読まず既定 edition 2015 で検査してしまうため、
    # workspace の正である Cargo.toml の edition を明示指定する。
    # CI（ci.yml の rust-ci の fmt）と重複するが、staged 限定で軽量なため例外として残す
    # （.claude/rules/git-hooks.md「明示的な例外」）
    - name: rustfmt-check
      glob: "*.rs"
      run: |
        if [ -f Cargo.toml ] && command -v rustfmt >/dev/null 2>&1; then
          ed=$(sed -n 's/^edition *= *"\([0-9]\{4\}\)".*/\1/p' Cargo.toml | head -n1)
          rustfmt --edition "${ed:-2024}" --check -- {staged_files}
        else
          echo "skip: Cargo.toml 未追加または rustfmt 未導入"
        fi

    # staged の trainer/**/*.py 変更を検出したら trainer プロジェクト全体を
    # ruff format --check する（{staged_files} は uv run --directory の cwd 変更後は
    # リポジトリルート相対のままになり、一部ファイルだけを渡すのは事故のもとのため、
    # 軽量な単一プロジェクトの現状は全体チェックで代替する）。
    # CI（python-ci.yml の make py-ci → py-fmt-check）と重複するが、trainer/ の .py が
    # staged のときだけ走り軽量なため例外として残す（.claude/rules/git-hooks.md「明示的な例外」）
    - name: ruff-format-check
      glob: "trainer/**/*.py"
      run: |
        if [ -f trainer/pyproject.toml ] && command -v uv >/dev/null 2>&1; then
          uv run --locked --directory trainer ruff format --check .
        else
          echo "skip: trainer/pyproject.toml 未追加または uv 未導入"
        fi

    # 秘密情報の混入検査（.claude/rules/security.md）。資格情報ファイルの stage を拒否する。
    # 判定は create-commit スキルの RE_CREDFILE / RE_CREDFILE_OK の対と同一の正規表現を
    # ベースにする（`(^|/)` アンカーでサブディレクトリ内の `.env.*` も検出し、
    # 拡張子なしの SSH 鍵 `id_rsa` / `id_ed25519` も拒否する。一方 `.env.example` 等の
    # 雛形・`id_rsa.pub` 等の公開鍵は許可リストで通す。拡張子 `.env` は旧パターンの
    # 検出範囲を維持するため追加している）。
    # {staged_files} は rename 後の名前しか含まないため、`.env` 等を無害な名前へ rename
    # すると素通りする。staged の name-status から rename / copy 元と先の両方を検査する。
    # `-C -C`（--find-copies-harder 相当）で、今回変更していない追跡済みファイルからの
    # コピーも copy として検出する（git 管理外のファイルからのコピーは git から元の名前を
    # 知る手段がないため、内容検査の secrets-content-guard が担う）。
    # 一覧を取得できない場合は検査不能として失敗させる（fail-closed）
    - name: secrets-guard
      run: |
        re='(^|/)\.env(\..+)?$|(^|/)(id_rsa|id_ed25519)(\..+)?$|\.(pem|p12|pfx|key|env)$'
        re_ok='\.(example|sample|template|pub)$'
        if ! status=$(git diff --cached --name-status -M -C -C --diff-filter=ACMR --no-ext-diff); then
          echo "NG: staged ファイル一覧を取得できないため秘密情報の検査を実施できません" >&2
          exit 1
        fi
        # name-status はタブ区切り（R/C 行は「状態 元 先」）。状態列を除いたパス列を 1 行 1 件に
        # 展開し、特殊文字を含むパスに git が付ける前後の二重引用符を外してから判定する。
        # 末尾 grep の終了状態は 0=一致あり・1=一致なし・2 以上=検査エラー（fail-closed）
        bad=$(printf '%s\n' "$status" | cut -f2- | tr '\t' '\n' | sed -e 's/^"//' -e 's/"$//' \
          | grep -E "$re" | grep -vE "$re_ok")
        rc=$?
        if [ "$rc" -gt 1 ]; then
          echo "NG: 秘密情報ファイルの判定でエラーが発生しました" >&2
          exit 1
        fi
        if [ -n "$bad" ]; then
          printf '%s\n' "$bad" | sed 's/^/NG: 秘密情報ファイルがステージされています（rename \/ copy 元を含む）: /' >&2
          exit 1
        fi

    # ファイル名パターンだけでは検出できない、内容そのものに秘密情報らしき
    # 文字列が含まれるケースの「うっかり」防止(網羅的な検出ではない。
    # サーバー側の最終防御線は GitHub の secret scanning + push protection
    # （リポジトリ設定で有効化済み）。誤検知した場合も --no-verify での回避は
    # 行わず、該当箇所の値を除去してから再ステージする）。
    # staged diff の追加行（`+` 始まり。削除行・`+++` ヘッダ行は対象外）のみを
    # 走査する。`--no-renames` により rename は「元の削除 + 先の新規追加」として扱い、
    # 内容が変わらない rename でも移動先の全行を走査する。バイナリファイルは
    # git diff が +/- 行を出力しないため対象外（バイナリの資格情報ファイルは
    # secrets-guard のファイル名検査が担う）。diff を取得できない場合は検査不能として
    # 失敗させる（fail-closed）。検出時はファイル名とパターン種別のみを表示し、
    # 値そのものは出力しない。
    - name: secrets-content-guard
      run: |
        # プロセス起動回数を diff 行数に比例させないため、awk 1 本で追加行の本文と
        # ファイル名を行対応の一時ファイルへ書き出し、パターンごとに grep -E を 1 回だけ
        # 実行する（Fandhe-AI/fandhe-browser の同名ジョブと同じ方式。awk の `{n}` 区間指定は
        # 古い mawk / BSD awk で使えないため grep -E 側で照合する。BSD / GNU の両方で動く）
        patterns='
        -----BEGIN [A-Z ]*PRIVATE KEY-----|private-key
        AKIA[0-9A-Z]{16}|aws-access-key-id
        gh[pousr]_[A-Za-z0-9]{36,}|github-token
        github_pat_[A-Za-z0-9_]{20,}|github-fine-grained-pat
        sk-ant-[A-Za-z0-9_-]{20,}|anthropic-api-key
        xox[abprs]-[A-Za-z0-9-]{10,}|slack-token
        AIza[0-9A-Za-z_-]{35}|google-api-key
        '
        tmp=$(mktemp -d) || exit 1
        trap 'rm -rf "$tmp"' EXIT
        # パイプの左辺（git diff）の失敗は右辺に隠れて成功扱いになるため、先にファイルへ
        # 書き出して終了状態を確認する（fail-closed）
        if ! git diff --cached --no-renames --diff-filter=ACMR -U0 --no-ext-diff --no-color -- . > "$tmp/diff"; then
          echo "NG: staged diff を取得できないため秘密情報の検査を実施できません" >&2
          exit 1
        fi
        # `+++ b/` ヘッダは `diff --git` から最初の `@@` までの間だけで解釈し、hunk 内の
        # 追加行（本文が `++ b/` で始まる行を含む）をヘッダと取り違えないようにする。
        # 空白を含むパスに git が付ける末尾のタブと、特殊文字を含むパスに付ける二重引用符
        # （`+++ "b/..."`）も外す。BSD awk は UTF-8 ロケールで不正なマルチバイト列を含む行に
        # 当たると異常終了するため LC_ALL=C で走査する（パターンは ASCII のみ）。
        # 書き込み失敗（close の失敗）は非ゼロで返し、件数は stderr 経由で受け取って
        # 書き出した行数と照合する（抽出漏れのまま合格させない）
        if ! LC_ALL=C awk -v cf="$tmp/content" -v nf="$tmp/names" '
          /^diff --git / { inhunk = 0; file = ""; next }
          /^@@ /         { inhunk = 1; next }
          !inhunk && /^\+\+\+ "b\// { file = substr($0, 8); sub(/\t$/, "", file); sub(/"$/, "", file); next }
          !inhunk && /^\+\+\+ b\//  { file = substr($0, 7); sub(/\t$/, "", file); next }
          !inhunk        { next }
          /^\+/          { print substr($0, 2) > cf; print (file == "" ? "(unknown)" : file) > nf; n++ }
          END {
            if (n > 0 && (close(cf) != 0 || close(nf) != 0)) exit 2
            print n + 0 > "/dev/stderr"
          }
        ' "$tmp/diff" 2> "$tmp/count"; then
          echo "NG: 追加行の抽出に失敗したため秘密情報の検査を実施できません" >&2
          exit 1
        fi
        n=$(cat "$tmp/count")
        case "$n" in
          ''|*[!0-9]*)
            echo "NG: 追加行の件数を取得できないため秘密情報の検査を実施できません" >&2
            exit 1
            ;;
        esac
        if [ "$n" -eq 0 ]; then
          exit 0
        fi
        if [ "$(wc -l < "$tmp/content" | tr -d ' ')" != "$n" ]; then
          echo "NG: 追加行の抽出結果が不完全なため秘密情報の検査を実施できません" >&2
          exit 1
        fi
        # grep の終了状態は 0=一致あり・1=一致なし・2 以上=検査エラー（fail-closed）。
        # パターンは ASCII のみのため LC_ALL=C で照合し、非 UTF-8 の行で grep が
        # 失敗しないようにする。-a は NUL 等を含む行をバイナリ扱いさせないため
        rc=0
        printf '%s\n' "$patterns" | {
          while IFS='|' read -r pat kind; do
            [ -z "$pat" ] && continue
            LC_ALL=C grep -aEn -m1 -- "$pat" "$tmp/content" > "$tmp/hit"
            grc=$?
            if [ "$grc" -gt 1 ]; then
              echo "NG: 秘密情報の判定でエラーが発生しました: pattern=$kind" >&2
              rc=1
            elif [ "$grc" -eq 0 ]; then
              ln=$(head -n1 "$tmp/hit" | cut -d: -f1)
              file=$(sed -n "${ln}p" "$tmp/names")
              echo "NG: 秘密情報らしき文字列を検出しました: file=${file:-(unknown)} pattern=$kind" >&2
              rc=1
            fi
          done
          exit "$rc"
        }

    # 依存の承認台帳と manifest・lock の照合（REQ-38・TASK-38.3・#165）。依存ファイルまたは
    # 台帳が staged のときだけ走らせる。承認記録のない依存変更はここで止まる。
    # CI（python-ci.yml の pytest: test_dependency_approvals.py）と重複するが、承認記録の
    # 漏れを PR 前に検知する設計ゲートとして例外的に残す（.claude/rules/git-hooks.md「明示的な例外」）
    - name: dependency-approvals
      glob:
        - "Cargo.toml"
        - "crates/*/Cargo.toml"
        - "Cargo.lock"
        - "trainer/pyproject.toml"
        - "trainer/uv.lock"
        - "dependency-approvals.json"
      run: |
        # 作業ツリーではなく index（staged）の内容（検証スクリプト本体を含む）を一時ディレクトリへ
        # 書き出し、その版のスクリプトで照合する。
        # 通信を避けるため uv は --no-project --offline で起動する（Makefile と同じ）
        if [ ! -f trainer/pyproject.toml ]; then
          echo "error: trainer/pyproject.toml が無いため依存承認の照合を実行できない" >&2
          exit 1
        elif ! command -v uv >/dev/null 2>&1; then
          echo "error: uv が PATH に無いため依存承認の照合を実行できない（make setup で導入）" >&2
          exit 1
        else
          tmp=$(mktemp -d) || exit 1
          trap 'rm -rf "$tmp"' EXIT
          git ls-files -z -- Cargo.toml 'crates/*/Cargo.toml' Cargo.lock \
            trainer/pyproject.toml trainer/uv.lock dependency-approvals.json \
            scripts/check_dependency_approvals.py \
            | xargs -0 git checkout-index --prefix="$tmp/" -- || exit 1
          uv run --no-project --offline --directory trainer python -I \
            "$tmp/scripts/check_dependency_approvals.py" --root "$tmp"
        fi

    # allow(unsafe_code) の出現箇所と許可リストの照合（REQ-39・#335）。Rust ソース・manifest・許可リスト
    # のいずれかが staged のときだけ走らせる。承認記録のない unsafe の追加はここで止まる。
    # CI（python-ci.yml の pytest: test_unsafe_allowlist.py）と重複するが、承認記録の
    # 漏れを PR 前に検知する設計ゲートとして例外的に残す（.claude/rules/git-hooks.md「明示的な例外」）
    - name: unsafe-allowlist
      glob:
        - "crates/**/*.rs"
        - "Cargo.toml"
        - "crates/*/Cargo.toml"
        - "unsafe-allowlist.json"
        - "scripts/check_unsafe_allowlist.py"
        - ".cargo/config"
        - ".cargo/config.toml"
      run: |
        # 作業ツリーではなく index（staged）の内容を一時ディレクトリへ書き出して照合する
        if [ ! -f trainer/pyproject.toml ]; then
          echo "error: trainer/pyproject.toml が無いため unsafe 許可リストの照合を実行できない" >&2
          exit 1
        elif ! command -v uv >/dev/null 2>&1; then
          echo "error: uv が PATH に無いため unsafe 許可リストの照合を実行できない（make setup で導入）" >&2
          exit 1
        else
          tmp=$(mktemp -d) || exit 1
          trap 'rm -rf "$tmp"' EXIT
          git ls-files -z -- ':(glob)crates/**/*.rs' Cargo.toml ':(glob)crates/*/Cargo.toml' \
            unsafe-allowlist.json scripts/check_unsafe_allowlist.py .cargo/config .cargo/config.toml \
            | xargs -0 git checkout-index --prefix="$tmp/" -- || exit 1
          uv run --no-project --offline --directory trainer python -I \
            "$tmp/scripts/check_unsafe_allowlist.py" --root "$tmp"
        fi

commit-msg:
  jobs:
    # Conventional Commits 形式の検証（.claude/rules/conventional-commits.md）。
    # オフラインで完結する軽量な正規表現検査とし、正式な commitlint（config-conventional +
    # commitlint.config.mjs）は CI（lint-docs の commitlint ジョブ）・make lint-commits が担う。
    # Merge / Revert / fixup コミットは対象外とする
    - name: conventional-commits
      run: |
        msg="$(head -n1 {1})"
        case "$msg" in
          Merge*|Revert*|fixup!*|squash!*) exit 0 ;;
        esac
        if ! printf '%s' "$msg" | grep -qE '^(feat|fix|perf|refactor|test|docs|build|ci|chore)(\([^)]+\))?!?: .+'; then
          echo "NG: Conventional Commits 形式ではありません: $msg" >&2
          echo "形式: <type>(<scope>): <説明>  （type: feat|fix|perf|refactor|test|docs|build|ci|chore）" >&2
          exit 1
        fi
        # 各行 100 文字以内（commitlint の header・body・footer の行長。UTF-16 単位で数える）。
        # python3 が無い環境は警告してスキップ（CI の commitlint が検知する）
        if command -v python3 >/dev/null 2>&1; then
          python3 -I scripts/check_commit_msg_length.py {1} || exit 1
        else
          echo "warn: python3 が無いため行長検査をスキップ（CI の commitlint で検査される）" >&2
        fi
