[package]
name = "fandhe-edge-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Guard layer (input validation before processing) for fandhe-edge-model."

[dependencies]
# 共通部分は workspace 内の path 依存のみ（REQ-39・TASK-39.2-1・#153）。外部 crate は下の rustix・libc のみ。
# 通常ファイル検証つきオープン（`fandhe_edge_core::fs`）と終了コード（`ExitCode`）を使う。
fandhe-edge-core.workspace = true

# ディレクトリ fd 起点の openat（O_NOFOLLOW）による経路の閉じ込め（REQ-39・TASK-39.4-1。
# 2026-09-29 オーナー承認）。open_confined を実装する Linux・macOS に限る（他 OS は fail-closed）。
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

# macOS の RSS プローブ（libproc の proc_pidinfo。REQ-39・TASK-39.5-2・#329。2026-10-01 オーナー承認）。
# setuid の /bin/ps が sandbox-exec 下で起動できないため（#327）。Linux は /proc を読むので不要。
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[lints]
workspace = true
