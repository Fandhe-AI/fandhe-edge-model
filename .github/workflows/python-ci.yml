name: Python CI

# 学習ワーカー（trainer/。Python・uv 管理。REQ-18〜20/19b）のローカルゲート
# （make py-ci = ruff format --check・ruff check・pytest）を検証する。
#
# ci.yml とは別ファイルにしている理由: ci.yml は workspace（Cargo.toml）・
# メンバー crate・deny.toml が揃うまで発火条件を無効化中（workflow_dispatch のみ）。
# 学習ワーカーは Rust workspace と独立して先に用意できるため、ci.yml の有効化を
# 待たずに本 workflow だけ先行して有効化する。ci.yml が有効化された時点で、
# 本 workflow のジョブ（python-ci）も ci.yml の `ci-complete` 集約 needs に
# 統合することを検討する（infra-builder が ci.yml 側の対応を行う）。
#
# paths フィルタを付けない理由: 本 workflow のジョブ名（python-ci）は
# ruleset `main-protection` の必須チェックに登録しているため、trainer/ 以外
# のみを変更する PR でも本 workflow 自体は必ず発火し「成功」を報告できる必要がある
# （paths フィルタで発火自体をスキップすると、必須チェックとして登録した場合に
# その PR がいつまでも「保留中」のまま扱われ、マージがブロックされ続ける）。
#
# MLX 未導入について: 学習ロジック（MLX 依存）は本 workflow の対象に含まない
# （trainer/pyproject.toml の dependencies は空。ツール整備のみ）ため、
# OS 非依存な ubuntu-latest で足りる。将来 MLX を用いた学習テストを追加する際は、
# MLX の wheel が macosx_14_0_arm64 以降のみ提供されるため pytest 実行を
# macOS（arm64）ランナーへ分離し、GPU（Metal）依存のテストは実機前提テスト
# （.claude/rules/ci.md）として既定のテスト集合から明示的に分ける。
#
# Python の版: trainer/.python-version はマイナー版（3.12）までを固定し、patch 版は
# 環境ごとに解決させる（ローカルは pyenv 等の 3.12.x、CI は uv が python-build-standalone
# から取得する管理版 3.12.x）。uv の管理版マニフェストに無い patch 版を固定すると CI で
# 解決できないため。版の一致は trainer/tests/test_environment.py が検証する。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    name: python-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # trainer/ が将来のリファクタで削除・改名された場合に、Makefile の
      # HAS_PY 判定による skip: を CI が「成功」として見逃さないための
      # fail-closed ガード（Makefile 側は未追加を正常系として静かにスキップする
      # 設計のため、CI ではこの前提を明示的に検査する）
      - name: trainer/pyproject.toml の存在を確認する（fail-closed）
        run: |
          if [ ! -f trainer/pyproject.toml ]; then
            echo "error: trainer/pyproject.toml が見つかりません（Python CI の対象が消失しています）" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          # 小規模プロジェクト（依存 3 件）のため、PR 間でのキャッシュ汚染
          # リスクを避けて無効化する（ビルド時間への影響は軽微）
          enable-cache: false

      - name: make py-ci
        run: make py-ci
