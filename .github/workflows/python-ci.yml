name: Python CI

# 学習ワーカー（trainer/。Python・uv 管理。REQ-18〜20/19b）のローカルゲート
# （make py-ci = ruff format --check・ruff check・pytest）を検証する。
#
# ci.yml とは別ファイルにしている理由: 学習ワーカーは Rust workspace と独立して
# 先に用意できたため、ci.yml の有効化（#31）を待たずに本 workflow だけ先行して
# 有効化した。ci.yml は現在稼働中で、必須チェックは `ci-complete` に集約している。
# 本 workflow のジョブ（python-ci）は独立した必須チェックのまま残しており、
# ci.yml の `ci-complete` 集約 needs への統合は検討中（統合する場合は ruleset の
# 必須チェックから python-ci を外す作業と同時に行う）。
#
# paths フィルタを付けない理由: 本 workflow のジョブ名（python-ci）は
# ruleset `main-protection` の必須チェックに登録しているため、trainer/ 以外
# のみを変更する PR でも本 workflow 自体は必ず発火し「成功」を報告できる必要がある
# （paths フィルタで発火自体をスキップすると、必須チェックとして登録した場合に
# その PR がいつまでも「保留中」のまま扱われ、マージがブロックされ続ける）。
#
# MLX（macOS arm64 ランナー）について: TASK-19.2（既定候補 C3）の実装で
# trainer/pyproject.toml の dependencies に mlx・numpy・onnx を追加した。
# MLX の wheel は macosx_14_0_arm64 以降のみ提供されるため（[tool.uv] environments
# の制約）、本 job は macos-14 で実行する。GitHub ホステッドランナーの `macos-14`
# （および `macos-15`・`macos-latest`）は Apple Silicon（arm64）の標準ランナーである
# （GitHub 公式ドキュメント about-github-hosted-runners の標準ランナー一覧）。
# MLX の wheel が要求する macOS 14 以上を満たす最も古い arm64 ラベルを使う。
# 念のため下記ステップでアーキテクチャを fail-closed に検査する（ランナーラベルの
# 意味が将来変わった場合に、CI が気づかず x86_64 上で「MLX 無しでも py-ci が通る」
# 状態へ静かに劣化するのを防ぐ）。
# pytest はすべて request.device="cpu" で MLX の CPU 経路のみを使い、決定的に
# 実行する（evaluation-contract.md: GPU〔Metal〕の非決定性をテストへ持ち込まない）。
# GPU（Metal）依存の性能測定・長時間学習は実機前提テスト（.claude/rules/ci.md）
# として本 workflow には含めない。
#
# Python の版: trainer/.python-version はマイナー版（3.12）までを固定し、patch 版は
# 環境ごとに解決させる（ローカルは pyenv 等の 3.12.x、CI は uv が python-build-standalone
# から取得する管理版 3.12.x）。uv の管理版マニフェストに無い patch 版を固定すると CI で
# 解決できないため。版の一致は trainer/tests/test_environment.py が検証する。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    name: python-ci
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # fail-closed: `macos-14` ラベルが指す実体が将来変わっても、arm64 以外
      # （MLX の wheel が存在しないアーキテクチャ）で「py-ci が通った」ことに
      # ならないよう、アーキテクチャの前提をここで明示的に検査する。
      - name: ランナーが arm64 であることを確認する（fail-closed）
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "error: expected arm64 runner (mlx wheel requires macosx_14_0_arm64), got: $arch" >&2
            exit 1
          fi

      # trainer/ が将来のリファクタで削除・改名された場合に、Makefile の
      # HAS_PY 判定による skip: を CI が「成功」として見逃さないための
      # fail-closed ガード（Makefile 側は未追加を正常系として静かにスキップする
      # 設計のため、CI ではこの前提を明示的に検査する）
      - name: trainer/pyproject.toml の存在を確認する（fail-closed）
        run: |
          if [ ! -f trainer/pyproject.toml ]; then
            echo "error: trainer/pyproject.toml が見つかりません（Python CI の対象が消失しています）" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          # PR 間でのキャッシュ汚染リスクを避けて無効化する（mlx-metal 等の
          # ダウンロードで多少ビルド時間は伸びるが、汚染リスク回避を優先する）
          enable-cache: false

      - name: make py-ci
        run: make py-ci
